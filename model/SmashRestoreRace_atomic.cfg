\* "atomic" restore = the OLD model's behavior (single-step decompress-restore).
\* Demonstrates the previous SmashSnapshotRace* models could not catch this bug:
\* with an atomic restore, NoStaleRead HOLDS.
CONSTANTS
    NumPages       = 1
    Readers        = {r1, r2}
    MaxCompress    = 2
    MaxReads       = 2
    RestoreVariant = "atomic"

SPECIFICATION Spec
INVARIANT NoStaleRead
