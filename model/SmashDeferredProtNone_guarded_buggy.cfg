\* "guarded" = the PRE-FIX code: compressPage's deferred branch restores PROT_RW
\* only when the CAPTURED page state was ACTIVE_MONITORING. But the escalator can
\* arm PROT_NONE on a page whose state reads ACTIVE, so the worker captures
\* st = ACTIVE, skips the restore, and reads a PROT_NONE page → NoProtNoneRead is
\* VIOLATED (TLC prints the interleaving Escalate ; WorkerCapture ; WorkerSnapshot).
\* NoStaleRead still HOLDS: the page is backed, so the crash is a fault, not a
\* silent zero-read. (See SmashDeferredProtNone.lean : guarded_violates_safe.)
CONSTANTS
    Variant = "guarded"

SPECIFICATION Spec
INVARIANT NoProtNoneRead
INVARIANT NoStaleRead
INVARIANT TypeOK
