\* "extent" external munmap = the FIX under the O(1) extent registry
\* (vm_region.h::trackExternalRange / findExtentByAddr). A large external mapping
\* is one extent record with a SHARED live flag, not one hash slot per page.
\* untrackExternalPageLocked still runs UNDER the per-page lock: it sets
\* PageState=EMPTY and ZEROES track_reverse_[idx] (revZeroed) before real_munmap.
\* The shared extent.live flag flips OUTSIDE the lock (routing only) and is NOT
\* what safety depends on — a worker that races a stale live=true still fetches a
\* null page_addr from the zeroed reverse slot and skips the read. NoUnmappedRead
\* and MutualExclusion HOLD, same as the per-page "locked" fix.
\* (See SmashExternalRace.lean : extent_inv_implies_safe, extent_race_schedule_safe,
\*  extent_munmap_first_safe.)
CONSTANTS
    Variant = "extent"

SPECIFICATION Spec
INVARIANT NoUnmappedRead
INVARIANT TypeOK
INVARIANT MutualExclusion
