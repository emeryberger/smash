name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout smash
        uses: actions/checkout@v4
        with:
          path: smash

      # smash's CMake expects ALLOC8_DIR=$smash/../alloc8 (a sibling dir).
      - name: Checkout alloc8 (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: emeryberger/alloc8
          path: alloc8

      - name: Configure
        working-directory: smash
        # On macOS, drop the arm64e slice — smash's CMakeLists defaults to
        # building arm64+arm64e for full DYLD_INSERT_LIBRARIES coverage of
        # Apple system binaries (which are arm64e), but GitHub's macos-
        # latest runner kernel rejects user-built arm64e binaries (PAC
        # ABI requires Apple's ARMA entitlement), causing every test to
        # SIGSEGV at load. arm64-only is fine for unit tests.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DSMASH_BUILD_TESTS=ON \
              -DCMAKE_OSX_ARCHITECTURES=arm64
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DSMASH_BUILD_TESTS=ON
          fi

      - name: Build
        working-directory: smash
        run: cmake --build build -j

      # The external_mapping_test exercises the new mmap / Mach VM
      # interposers under a live compressor — that's the regression
      # surface this PR introduces. Other tests cover the existing
      # invariants.
      - name: Run tests
        working-directory: smash
        run: ctest --test-dir build --output-on-failure --timeout 120
