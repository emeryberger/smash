\* "split" restore = the REAL pre-fix code: mprotect(PROT_RW) THEN memcpy.
\* Exposes the decompress-on-fault TOCTOU window. NoStaleRead is VIOLATED:
\* a concurrent reader loads the page after it became readable but before the
\* decompressed bytes were written.
CONSTANTS
    NumPages       = 1
    Readers        = {r1, r2}
    MaxCompress    = 2
    MaxReads       = 2
    RestoreVariant = "split"

SPECIFICATION Spec
INVARIANT NoStaleRead
