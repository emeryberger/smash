name: Release

# Produces drop-in libsmash binaries for every supported platform and
# attaches them to the GitHub Release:
#
#   libsmash-linux-x86_64.so    (glibc 2.17 floor — AL2023, Ubuntu 20.04+,
#   libsmash-linux-aarch64.so    Debian 11+, RHEL/CentOS 7+, Fedora, …)
#   libsmash-macos-arm64.dylib   (Apple Silicon)
#
# Linux artifacts are built inside manylinux2014 containers so they import
# only glibc ≤ 2.17 symbols. Combined with smash's exported-symbol version
# script (src/smash_version_script.map.in, which re-exports malloc/new/stat
# at the higher GLIBC_2.33/2.34 versions modern binaries request), this makes
# a single .so per arch interpose correctly across distros without rebuilding.
#
# lz4 and zstd are statically linked (see CMakeLists.txt), so there are no
# third-party shared-library runtime dependencies beyond libc/libstdc++/libdl/
# libpthread, all of which ship with every target distro.

on:
  release:
    types: [published]
  # Manual trigger: build the artifacts without (or before) cutting a release.
  # When run this way the binaries are uploaded as workflow artifacts only;
  # the release-upload job is skipped (it is gated on a release event).
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA) to build"
        required: false
        default: ""

permissions:
  contents: write          # needed to upload assets to the Release

jobs:
  # ── Linux x86-64 and ARM64 inside manylinux_2_28 (glibc 2.28) ─────────────
  # glibc 2.28 (AlmaLinux 8 base) is the drop-in floor: it covers AL2023
  # (2.34), Ubuntu 20.04+ (2.31), Debian 11+ (2.31), RHEL/Rocky/Alma 8+
  # (2.28), and Fedora. We deliberately do NOT use manylinux2014 (glibc 2.17,
  # CentOS 7): its kernel headers and stdlib are too old to compile smash
  # (missing sys/random.h, MADV_FREE/PAGEOUT, C++20 <concepts>).
  build-linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            manylinux_arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            manylinux_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      # IMPORTANT: we check out and run actions ON THE HOST runner (modern
      # glibc), NOT inside the manylinux container. The manylinux glibc is
      # older than actions/checkout's bundled Node needs — using the image as
      # a job `container:` makes every JS action die with "GLIBC_x not found".
      # Instead, only the *build* runs inside the container (via docker run on
      # the bind-mounted workspace), so the artifact gets the manylinux glibc
      # floor while checkout/upload run on the host.
      - name: Checkout smash
        uses: actions/checkout@v4
        with:
          path: smash
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Checkout alloc8 (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: emeryberger/alloc8
          path: alloc8

      - name: Build libsmash inside manylinux_2_28 (glibc 2.28)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            quay.io/pypa/manylinux_2_28_${{ matrix.manylinux_arch }} \
            bash -euo pipefail -c '
              # manylinux ships gcc-toolset (C++20-capable) on PATH; cmake/
              # ninja via the bundled CPython pip.
              /opt/python/cp312-cp312/bin/python -m pip install --upgrade cmake ninja >/dev/null
              ln -sf /opt/python/cp312-cp312/bin/cmake /usr/local/bin/cmake
              ln -sf /opt/python/cp312-cp312/bin/ninja /usr/local/bin/ninja
              cmake --version; gcc --version
              # Point at the sibling alloc8 checkout (no network fetch of
              # alloc8; lz4/zstd are still FetchContent. Library only.
              cmake -S smash -B smash/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DALLOC8_DIR=/work/alloc8 \
                -DSMASH_BUILD_TESTS=OFF \
                -DSMASH_BUILD_BENCH=OFF
              cmake --build smash/build --target smash -j
              # Build runs as container root; make outputs world-readable so
              # the host steps (objdump, upload-artifact) can read them.
              chmod -R a+rX smash/build
            '

      - name: Stage artifact and verify glibc floor
        working-directory: smash
        run: |
          mkdir -p out
          cp build/libsmash.so "out/libsmash-linux-${{ matrix.arch }}.so"
          # Fail loudly if the glibc floor regressed above 2.28 — that would
          # silently break drop-in use on older distros (RHEL/Alma/Rocky 8).
          # Only IMPORTED (undefined, "*UND*") symbols set the floor; smash
          # deliberately *exports* re-export aliases at GLIBC_2.33/2.34 via its
          # version script (so it out-versions modern libc's malloc/stat/new),
          # and those defined symbols must NOT count against the import floor.
          FLOOR=2.28
          echo "=== imported GLIBC version requirements (UND only) ==="
          objdump -T "out/libsmash-linux-${{ matrix.arch }}.so" \
            | grep '\*UND\*' | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' \
            | sort -u -V | tee glibc_versions.txt
          # The highest required version must not sort above the floor.
          MAXREQ=$(sort -V glibc_versions.txt | tail -1)
          HIGHEST=$(printf '%s\n%s\n' "$FLOOR" "$MAXREQ" | sort -V | tail -1)
          if [ "$HIGHEST" != "$FLOOR" ]; then
            echo "::error::libsmash imports glibc $MAXREQ > floor $FLOOR — drop-in portability regressed"
            exit 1
          fi
          echo "Highest imported glibc symbol: $MAXREQ (floor $FLOOR) — OK"
          echo "=== shared library dependencies (should be only libc/libstdc++/libdl/libpthread/libm) ==="
          ldd "out/libsmash-linux-${{ matrix.arch }}.so" || true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsmash-linux-${{ matrix.arch }}
          path: smash/out/libsmash-linux-${{ matrix.arch }}.so
          if-no-files-found: error

  # ── macOS arm64 (Apple Silicon) ──────────────────────────────────────────
  build-macos:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - name: Checkout smash
        uses: actions/checkout@v4
        with:
          path: smash
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Checkout alloc8 (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: emeryberger/alloc8
          path: alloc8

      - name: Configure (fat arm64 + arm64e)
        working-directory: smash
        # Build FAT. libsmash must carry an arm64e slice to interpose into
        # arm64e processes — an arm64-only dylib fails to load into an arm64e
        # app with "incompatible architecture (have 'arm64', need 'arm64e')".
        # We ship two macOS assets from this one build (see the stage step):
        # the arm64-only dylib as a direct download, and the fat dylib in a zip.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DALLOC8_DIR="$GITHUB_WORKSPACE/alloc8" \
            -DSMASH_BUILD_TESTS=OFF \
            -DSMASH_BUILD_BENCH=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;arm64e"

      - name: Build libsmash
        working-directory: smash
        run: cmake --build build --target smash -j

      - name: Stage artifacts (arm64-only dylib + fat zip)
        working-directory: smash
        run: |
          mkdir -p out
          # Fat (arm64 + arm64e) — the arm64e-capable artifact. Re-sign ad-hoc:
          # the linker already ad-hoc-signs, but arm64e MANDATES a valid
          # signature to load, so make it explicit and deterministic.
          cp build/libsmash.dylib out/libsmash-macos-fat.dylib
          codesign --force --sign - out/libsmash-macos-fat.dylib

          # arm64-only drop-in: thinned from the SAME build, so its arm64 slice
          # is byte-identical to the fat one's. lipo strips the signature, so
          # re-sign the thinned copy.
          lipo out/libsmash-macos-fat.dylib -thin arm64 \
            -output out/libsmash-macos-arm64.dylib
          codesign --force --sign - out/libsmash-macos-arm64.dylib

          echo "=== fat ===";   lipo -archs out/libsmash-macos-fat.dylib
          codesign -v --verbose=2 out/libsmash-macos-fat.dylib
          echo "=== arm64 ==="; lipo -archs out/libsmash-macos-arm64.dylib
          codesign -v --verbose=2 out/libsmash-macos-arm64.dylib
          otool -L out/libsmash-macos-fat.dylib

      - name: Verify the fat dylib carries a signed arm64e slice
        working-directory: smash
        # Static hard gate — runs on any macOS. The fat dylib MUST contain a
        # validly-signed arm64e slice; that's the whole reason for the fat
        # build. The DYNAMIC "does it actually load into an arm64e process"
        # check lives in the separate verify-macos-arm64e job: executing a
        # third-party arm64e binary needs a runner OS that allows it (macOS 26),
        # and this build job runs on macos-14, which SIGKILLs such a process
        # (no -arm64e_preview_abi boot-arg on hosted runners).
        run: |
          lipo -archs out/libsmash-macos-fat.dylib | tr ' ' '\n' | grep -qx arm64e \
            || { echo "FAIL: fat dylib has no arm64e slice"; exit 1; }
          codesign -v --verbose=2 out/libsmash-macos-fat.dylib

      - name: Package the fat dylib as a zip
        working-directory: smash/out
        # The zip is the delivery vehicle for the fat/arm64e slice; -X drops
        # extra attributes so the archive is reproducible.
        run: zip -X libsmash-macos-fat.zip libsmash-macos-fat.dylib

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libsmash-macos
          path: |
            smash/out/libsmash-macos-arm64.dylib
            smash/out/libsmash-macos-fat.zip
          if-no-files-found: error

  # ── Dynamically verify the shipped fat dylib loads into an arm64e process ──
  #    Runs on macos-26: executing a third-party arm64e binary needs a runner
  #    OS that permits it, and macOS 26 does (older hosted images SIGKILL it,
  #    lacking the -arm64e_preview_abi boot-arg). Tests the ACTUAL shipped
  #    artifact — downloads the zip, unzips, and preloads the dylib through the
  #    same round-trip a user gets — so the arm64e code signature is verified
  #    end-to-end, not just at build time.
  verify-macos-arm64e:
    name: verify-macos-arm64e
    needs: build-macos
    runs-on: macos-26
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: libsmash-macos
          path: dist

      - name: Preload the fat dylib into a real arm64e process
        working-directory: dist
        run: |
          unzip -o libsmash-macos-fat.zip
          echo "fat slices: $(lipo -archs libsmash-macos-fat.dylib)"
          codesign -v --verbose=2 libsmash-macos-fat.dylib
          cat > /tmp/probe.c <<'EOF'
          #include <stdlib.h>
          #include <stdio.h>
          int main(void) {
            void *p = malloc(1 << 20);
            if (!p) return 1;
            free(p);
            puts("ok");
            return 0;
          }
          EOF
          clang -arch arm64e -O2 -o /tmp/probe_e /tmp/probe.c
          echo "probe arch: $(lipo -archs /tmp/probe_e)"
          # Capability probe: can this runner exec a third-party arm64e binary
          # at all? Run the bare probe (no dylib). A runner that can't (older
          # macOS) SIGKILLs it, so the substitution fails; the `if` condition
          # keeps that non-zero exit from tripping `set -e` and we skip rather
          # than block the release. macOS 26 runs it, so this normally asserts.
          if bare=$(/tmp/probe_e 2>/dev/null) && [ "$bare" = ok ]; then
            echo "runner can exec arm64e — running DYLD_INSERT load check"
            out=$(DYLD_INSERT_LIBRARIES="$PWD/libsmash-macos-fat.dylib" /tmp/probe_e)
            echo "arm64e probe output: [$out]"
            test "$out" = ok
          else
            echo "::warning::runner cannot exec third-party arm64e; skipped dynamic load check (static arm64e slice + signature checks ran in build-macos)."
          fi

  # ── Attach all artifacts to the Release (release events only) ─────────────
  publish:
    name: publish-to-release
    needs: [build-linux, build-macos, verify-macos-arm64e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten and checksum
        run: |
          mkdir -p release
          find dist -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.zip' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "=== release assets ==="
          ls -l
          cat SHA256SUMS.txt

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          # append_body so a hand-written release note isn't clobbered; this
          # adds the platform usage block (incl. the macOS quarantine step,
          # which is required because the dylib is ad-hoc-signed and the
          # browser tags downloads with com.apple.quarantine).
          append_body: true
          body: |

            ## Usage

            **Linux** (`libsmash-linux-{x86_64,aarch64}.so`)
            ```sh
            LD_PRELOAD=./libsmash-linux-x86_64.so SMASH_LARGE_ONLY=1 ./your_program
            ```

            **macOS** (Apple Silicon) — two artifacts:

            - `libsmash-macos-arm64.dylib` — arm64 only. The drop-in for
              ordinary arm64 apps.
            - `libsmash-macos-fat.zip` — fat arm64 + arm64e. Needed to
              interpose into **arm64e** apps (an arm64-only dylib fails to load
              into an arm64e process). Shipped as a zip so the arm64e slice's
              code signature is delivered intact.

            ```sh
            # arm64 app — direct download:
            xattr -d com.apple.quarantine libsmash-macos-arm64.dylib
            DYLD_INSERT_LIBRARIES=./libsmash-macos-arm64.dylib ./your_program

            # arm64e app — use the fat build from the zip:
            unzip libsmash-macos-fat.zip
            xattr -d com.apple.quarantine libsmash-macos-fat.dylib
            DYLD_INSERT_LIBRARIES=./libsmash-macos-fat.dylib ./your_program
            ```
            The `xattr -d` is required once after downloading: the browser tags
            the file with `com.apple.quarantine`, and dyld otherwise refuses the
            ad-hoc-signed dylib with "library load disallowed by system policy".
            macOS strips `DYLD_*` for SIP-protected system binaries (e.g.
            `/bin/*`), so interposition applies to your own binaries.

            Verify integrity against `SHA256SUMS.txt`.
          files: |
            release/libsmash-linux-x86_64.so
            release/libsmash-linux-aarch64.so
            release/libsmash-macos-arm64.dylib
            release/libsmash-macos-fat.zip
            release/SHA256SUMS.txt
