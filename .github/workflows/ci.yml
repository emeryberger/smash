name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: aarch64 Linux. An aarch64-only uffd SIGBUS once
        # slipped past x86-only CI (fixed by mapping the uffd scratch with
        # rawMmap); run the whole suite on both Linux ISAs.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - name: Checkout smash
        uses: actions/checkout@v4
        with:
          path: smash

      # smash's CMake expects ALLOC8_DIR=$smash/../alloc8 (a sibling dir).
      - name: Checkout alloc8 (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: emeryberger/alloc8
          path: alloc8

      - name: Configure
        working-directory: smash
        # On macOS, drop the arm64e slice — smash's CMakeLists defaults to
        # building arm64+arm64e for full DYLD_INSERT_LIBRARIES coverage of
        # Apple system binaries (which are arm64e), but GitHub's macos-
        # latest runner kernel rejects user-built arm64e binaries (PAC
        # ABI requires Apple's ARMA entitlement), causing every test to
        # SIGSEGV at load. arm64-only is fine for unit tests.
        #
        # SMASH_BUILD_BENCH=ON pulls in the benchmark targets we need for
        # the regression-spotting CI step (bench_rss, bench_sqlite).
        # SMASH_BUILD_BENCH_DEPS=OFF skips building external services
        # (Redis/memcached/RocksDB from source) that the paper-experiment
        # runner uses but the quick CI doesn't need.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DSMASH_BUILD_TESTS=ON \
              -DSMASH_BUILD_BENCH=ON \
              -DSMASH_BUILD_BENCH_DEPS=OFF \
              -DSMASH_BUILD_BENCH_ALLOCATORS=OFF \
              -DCMAKE_OSX_ARCHITECTURES=arm64
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DSMASH_BUILD_TESTS=ON \
              -DSMASH_BUILD_BENCH=ON \
              -DSMASH_BUILD_BENCH_DEPS=OFF \
              -DSMASH_BUILD_BENCH_ALLOCATORS=OFF
          fi

      # bench/CMakeLists.txt guards optional allocator-comparison
      # targets (jemalloc, hoard, mesh, diehard, rocksdb) on
      # find_library success, so missing system packages cleanly skip
      # those targets instead of failing the build. cJSON / sqlite3 /
      # mimalloc are FetchContent-fetched, always build.
      - name: Build
        working-directory: smash
        run: cmake --build build -j

      # Never build for the host CPU: CI caches builds and GitHub runners
      # vary (Intel Xeon 6975P / AMD EPYC 7763), so -march=native output can
      # SIGILL on the next runner. Scan every generated CMake compile/link
      # flag file, including the ExternalProjects under build/bench/deps.
      - name: Check no native-CPU flags
        working-directory: smash
        run: |
          if grep -rlE --include=flags.make --include=link.txt \
               --include=build.ninja -e '-m(arch|cpu|tune)=native' build; then
            echo "::error::build uses -march/-mcpu/-mtune=native (files above)"
            exit 1
          fi

      # External-mapping + malloc-compression tests exercise the live
      # compressor under DYLD_INSERT_LIBRARIES / LD_PRELOAD; other tests
      # cover the unit-level invariants.
      - name: Run tests
        working-directory: smash
        run: ctest --test-dir build --output-on-failure --timeout 120

      # Installed layout: ${prefix}/bin/smash must find ${prefix}/lib/libsmash.*
      # on its own (the ctest launcher tests cover the build-tree layout).
      - name: Install and smoke-test the launcher
        working-directory: smash
        run: |
          cmake --install build --component smash --prefix "$RUNNER_TEMP/smash"
          "$RUNNER_TEMP/smash/bin/smash" version
          "$RUNNER_TEMP/smash/bin/smash" doctor || true
          "$RUNNER_TEMP/smash/bin/smash" run --report -- build/tests/launcher_test

      # Regression-spotting benchmarks — runs bench_rss (in-process) and
      # bench_sqlite (--quick under preload). Asserts headline RSS-
      # reduction percentages stay above conservative thresholds. See
      # bench/run_quick_ci.py for the parsing + thresholds.
      - name: Run quick benchmarks
        working-directory: smash
        run: python3 bench/run_quick_ci.py --build-dir build

      # Same benchmarks in large-only mode (the production configuration) on
      # macOS, where SQLite allocates through malloc_default_zone() and sizes
      # blocks with zone->size(): system-passthrough pointers once sized as 0
      # there and bench_sqlite spun forever in growOpArray(). ~1 min locally.
      - name: Run quick benchmarks (large-only, macOS)
        if: runner.os == 'macOS'
        working-directory: smash
        env:
          SMASH_LARGE_ONLY: "1"
        run: python3 bench/run_quick_ci.py --build-dir build

  # ── SMASH_TRACK_EXTERNAL=1 forced ────────────────────────────────────────
  # The whole suite with SMASH_TRACK_EXTERNAL=1 in every test's environment
  # (tests/CMakeLists.txt: SMASH_TEST_FORCE_TRACK_EXTERNAL), then the soak and
  # fork-under-threads stress with it set, on both Linux ISAs and macOS: the
  # evidence base for making external tracking the default. liburing-dev
  # builds the liburing fixed-buffer case of test_iouring_*.
  te-forced:
    name: TRACK_EXTERNAL=1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: smash
      - uses: actions/checkout@v4
        with:
          repository: emeryberger/alloc8
          path: alloc8
      - name: liburing (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y liburing-dev || true
      - name: Configure + build
        working-directory: smash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="-DCMAKE_OSX_ARCHITECTURES=arm64"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSMASH_BUILD_TESTS=ON \
            -DSMASH_TEST_FORCE_TRACK_EXTERNAL=ON $extra
          cmake --build build -j
      - name: Run tests (SMASH_TRACK_EXTERNAL=1)
        working-directory: smash
        run: ctest --test-dir build --output-on-failure --timeout 120
      - name: Soak, both modes, SMASH_TRACK_EXTERNAL=1
        working-directory: smash
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then pre="DYLD_INSERT_LIBRARIES=$PWD/build/libsmash.dylib MallocNanoZone=0"
          else pre="LD_PRELOAD=$PWD/build/libsmash.so"; fi
          for lo in 0 1; do
            env $pre SMASH_TRACK_EXTERNAL=1 SMASH_LARGE_ONLY=$lo SMASH_DEFER_PHASES_MS=0 \
              SMASH_COLD_TIMEOUT_SEC=1 SMASH_SOAK_TOGGLE=1 timeout 300 build/tests/soak_test 60 8
          done
      - name: fork() under threads, both modes, SMASH_TRACK_EXTERNAL=1
        if: runner.os == 'Linux'
        working-directory: smash
        run: |
          set -e
          for lo in 0 1 0 1; do
            env LD_PRELOAD="$PWD/build/libsmash.so" SMASH_TRACK_EXTERNAL=1 SMASH_LARGE_ONLY=$lo \
              SMASH_DEFER_PHASES_MS=0 SMASH_COLD_TIMEOUT_SEC=1 \
              timeout 600 build/tests/fork_stress_test 300 6
          done

  # ── Packages + oldest supported glibc ────────────────────────────────────
  # Builds libsmash and its .deb/.rpm/.tar.gz exactly as release.yml does
  # (manylinux_2_28, packaging/linux/build-manylinux.sh), then installs the
  # .deb on glibc 2.31 (Ubuntu 20.04, Debian 11) and the .rpm on glibc 2.28
  # (AlmaLinux 8) and preloads a probe in both modes. glibc < 2.34's dlsym
  # callocs its dlerror state, re-entering a half-initialised smash; that once
  # hung (full mode) or stack-overflowed (large-only) every preloaded process,
  # and ubuntu-latest's glibc is too new for the main job to notice.
  packages-old-glibc:
    name: packages (glibc 2.28/2.31)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smash
        uses: actions/checkout@v4
        with:
          path: smash

      - name: Checkout alloc8 (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: emeryberger/alloc8
          path: alloc8

      - name: Build libsmash + packages in manylinux_2_28
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash smash/packaging/linux/build-manylinux.sh /work/smash /work/alloc8

      - name: Install and preload on Ubuntu 20.04, Debian 11, AlmaLinux 8
        working-directory: smash
        run: |
          mkdir -p probe
          printf '#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){char*p=malloc(4<<20);if(!p)return 1;memset(p,1,4<<20);free(p);puts("probe ok");return 0;}\n' > probe/probe.c
          docker run --rm -v "$PWD/probe:/p" quay.io/pypa/manylinux_2_28_x86_64 \
            gcc -O2 -o /p/probe /p/probe.c
          for img in ubuntu:20.04 debian:11 quay.io/pypa/manylinux_2_28_x86_64; do
            docker run --rm -v "$PWD/build/pkg:/pkg:ro" -v "$PWD/probe:/p:ro" "$img" \
              bash -euo pipefail -c '
                . /etc/os-release; echo "== $PRETTY_NAME"
                if command -v dpkg >/dev/null; then dpkg -i /pkg/smash_*_amd64.deb >/dev/null
                else rpm -i /pkg/smash-*.x86_64.rpm; fi
                for mode in 0 1; do
                  out=$(SMASH_STATS=1 SMASH_LARGE_ONLY=$mode timeout 60 /usr/bin/smash run -- /p/probe 2>&1)
                  echo "SMASH_LARGE_ONLY=$mode: $out"
                  grep -q "probe ok" <<<"$out"
                  grep -q "\[smash stats\]" <<<"$out"
                done
              '
          done

  # Concurrency stress: long soak (threads alloc/free/realloc + concurrent
  # decompress faults + kill switch flipping underneath), fork-under-threads
  # (issue #61), in BOTH modes, on both Linux ISAs; plus a ThreadSanitizer
  # build of the in-process unit tests. Seeds are printed (SMASH_SOAK_SEED) so a
  # failure can be replayed.
  stress:
    name: stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          path: smash
      - uses: actions/checkout@v4
        with:
          repository: emeryberger/alloc8
          path: alloc8
      - name: Build (Release)
        working-directory: smash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSMASH_BUILD_TESTS=ON
          cmake --build build -j
      - name: Soak, both modes (2 min each, kill switch toggling)
        working-directory: smash
        run: |
          set -e
          for lo in 0 1; do
            for toggle in 1 0; do
              env LD_PRELOAD="$PWD/build/libsmash.so" SMASH_LARGE_ONLY=$lo \
                SMASH_DEFER_PHASES_MS=0 SMASH_COLD_TIMEOUT_SEC=1 SMASH_SOAK_TOGGLE=$toggle \
                timeout 300 build/tests/soak_test $((toggle ? 120 : 60)) 8
            done
          done
      - name: fork() under threads, both modes (issue #61)
        working-directory: smash
        run: |
          set -e
          for lo in 0 1 0 1; do
            env LD_PRELOAD="$PWD/build/libsmash.so" SMASH_LARGE_ONLY=$lo \
              SMASH_DEFER_PHASES_MS=0 SMASH_COLD_TIMEOUT_SEC=1 \
              timeout 600 build/tests/fork_stress_test 300 6
          done
      - name: Build unit tests with ThreadSanitizer
        working-directory: smash
        # Ubuntu 24.04 kernels default to vm.mmap_rnd_bits=32, which TSan's
        # fixed shadow layout rejects ("unexpected memory mapping").
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
          CC=clang CXX=clang++ cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSMASH_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS=-fsanitize=thread -DCMAKE_CXX_FLAGS=-fsanitize=thread \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan -j
      # Gating: every in-process unit test (a race in any of them fails CI),
      # including the two that run the live compressor threads against app
      # threads (test_contention, test_stop_no_drain). Preload tests are not
      # run under TSan (its runtime and an interposed malloc do not mix);
      # test_smash_estimate* measure a target's RSS, which TSan's shadow
      # memory inflates; test_fault_cycle is disabled everywhere.
      - name: ThreadSanitizer
        working-directory: smash
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: >
          ctest --test-dir build-tsan --output-on-failure --timeout 600
          -R '^(test_size_classes|test_bootstrap|test_span|test_slab|test_vm_region|test_spill_store|test_integration|test_compression|test_dictionary|test_prefetch|test_compression_ratio|test_profile_dict_persistence|test_contention|test_stop_no_drain|test_cgroup_monitor|test_safety|test_profile_.*)$'
