\* SmashCoreSym — BUGGY mode (BuggyMode = TRUE). Expect: SafetyInv VIOLATED.
\* The freelist-PROT_NONE bug: a page freed while COMPRESSED keeps PROT_NONE
\* through the (skipped-commitPages) decommit path; the allocator then pops it
\* EMPTY->ACTIVE with PROT_NONE, violating ActiveImpliesRW.
CONSTANTS
    Pages         = {p1, p2}
    AppThreads    = {t1, t2}
    Compressors   = {c1, c2}
    ColdThreshold = 1
    MaxReleases   = 1
    BuggyMode     = TRUE

SPECIFICATION Spec
SYMMETRY AllSymmetry
INVARIANT TypeOK
INVARIANT SafetyInv
