\* "procmem" restore = the FIX (restorePageContents): write decompressed bytes
\* into the backing via /proc/self/mem while the page is still PROT_NONE, THEN
\* flip to PROT_RW. NoStaleRead HOLDS: readers fault on PROT_NONE until the data
\* is in place.
CONSTANTS
    NumPages       = 1
    Readers        = {r1, r2}
    MaxCompress    = 2
    MaxReads       = 2
    RestoreVariant = "procmem"

SPECIFICATION Spec
INVARIANT NoStaleRead
