\* "locked" external munmap = the FIX: deregisterLinuxExternalRange acquires the
\* per-page lock before clearing PageState/untracking, and releases it before
\* real_munmap (no TLB-shootdown IPI held under the lock -> deadlock-free). While
\* a worker holds the lock across check->snapshot, munmap cannot run, so the
\* worker never reads an unmapped page. NoUnmappedRead and MutualExclusion HOLD.
\* (See SmashExternalRace.lean : locked_inv_implies_safe, locked_mutual_exclusion.)
CONSTANTS
    Variant = "locked"

SPECIFICATION Spec
INVARIANT NoUnmappedRead
INVARIANT TypeOK
INVARIANT MutualExclusion
