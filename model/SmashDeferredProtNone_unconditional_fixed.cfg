\* "unconditional" = the FIX (PR #55): compressPage's deferred branch restores
\* PROT_RW UNCONDITIONALLY before the snapshot read, regardless of the captured
\* state. So even when the escalator armed PROT_NONE on an ACTIVE page, the worker
\* re-establishes PROT_RW before reading. NoProtNoneRead HOLDS. NoStaleRead HOLDS
\* too — the page is still backed, so the restored read returns live data (no
\* silent corruption). (See SmashDeferredProtNone.lean : fixed_inv_implies_safe.)
CONSTANTS
    Variant = "unconditional"

SPECIFICATION Spec
INVARIANT NoProtNoneRead
INVARIANT NoStaleRead
INVARIANT TypeOK
