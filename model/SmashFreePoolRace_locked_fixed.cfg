\* pop inside the lock that recycleFreeRun's push already holds). Pop and push
\* are mutually exclusive, so free_pool is never concurrently mutated → stays
\* acyclic → allocatePages/newFreeRun walks terminate. NoCorrupt + MutualExclusion HOLD.
\* See SmashFreePoolRace.lean : locked_inv_implies_safe, locked_mutual_exclusion.
CONSTANTS
    Variant = "locked"
SPECIFICATION Spec
INVARIANT NoCorrupt
INVARIANT TypeOK
INVARIANT MutualExclusion
