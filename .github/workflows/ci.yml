name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout smash
        uses: actions/checkout@v4
        with:
          path: smash

      # smash's CMake expects ALLOC8_DIR=$smash/../alloc8 (a sibling dir).
      - name: Checkout alloc8 (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: emeryberger/alloc8
          path: alloc8

      - name: Configure
        working-directory: smash
        # On macOS, drop the arm64e slice — smash's CMakeLists defaults to
        # building arm64+arm64e for full DYLD_INSERT_LIBRARIES coverage of
        # Apple system binaries (which are arm64e), but GitHub's macos-
        # latest runner kernel rejects user-built arm64e binaries (PAC
        # ABI requires Apple's ARMA entitlement), causing every test to
        # SIGSEGV at load. arm64-only is fine for unit tests.
        #
        # SMASH_BUILD_BENCH=ON pulls in the benchmark targets we need for
        # the regression-spotting CI step (bench_rss, bench_sqlite).
        # SMASH_BUILD_BENCH_DEPS=OFF skips building external services
        # (Redis/memcached/RocksDB from source) that the paper-experiment
        # runner uses but the quick CI doesn't need.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DSMASH_BUILD_TESTS=ON \
              -DSMASH_BUILD_BENCH=ON \
              -DSMASH_BUILD_BENCH_DEPS=OFF \
              -DSMASH_BUILD_BENCH_ALLOCATORS=OFF \
              -DCMAKE_OSX_ARCHITECTURES=arm64
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DSMASH_BUILD_TESTS=ON \
              -DSMASH_BUILD_BENCH=ON \
              -DSMASH_BUILD_BENCH_DEPS=OFF \
              -DSMASH_BUILD_BENCH_ALLOCATORS=OFF
          fi

      # bench/CMakeLists.txt guards optional allocator-comparison
      # targets (jemalloc, hoard, mesh, diehard, rocksdb) on
      # find_library success, so missing system packages cleanly skip
      # those targets instead of failing the build. cJSON / sqlite3 /
      # mimalloc are FetchContent-fetched, always build.
      - name: Build
        working-directory: smash
        run: cmake --build build -j

      # Never build for the host CPU: CI caches builds and GitHub runners
      # vary (Intel Xeon 6975P / AMD EPYC 7763), so -march=native output can
      # SIGILL on the next runner. Scan every generated CMake compile/link
      # flag file, including the ExternalProjects under build/bench/deps.
      - name: Check no native-CPU flags
        working-directory: smash
        run: |
          if grep -rlE --include=flags.make --include=link.txt \
               --include=build.ninja -e '-m(arch|cpu|tune)=native' build; then
            echo "::error::build uses -march/-mcpu/-mtune=native (files above)"
            exit 1
          fi

      # External-mapping + malloc-compression tests exercise the live
      # compressor under DYLD_INSERT_LIBRARIES / LD_PRELOAD; other tests
      # cover the unit-level invariants.
      - name: Run tests
        working-directory: smash
        run: ctest --test-dir build --output-on-failure --timeout 120

      # Installed layout: ${prefix}/bin/smash must find ${prefix}/lib/libsmash.*
      # on its own (the ctest launcher tests cover the build-tree layout).
      - name: Install and smoke-test the launcher
        working-directory: smash
        run: |
          cmake --install build --component smash --prefix "$RUNNER_TEMP/smash"
          "$RUNNER_TEMP/smash/bin/smash" version
          "$RUNNER_TEMP/smash/bin/smash" doctor || true
          "$RUNNER_TEMP/smash/bin/smash" run --report -- build/tests/launcher_test

      # Regression-spotting benchmarks — runs bench_rss (in-process) and
      # bench_sqlite (--quick under preload). Asserts headline RSS-
      # reduction percentages stay above conservative thresholds. See
      # bench/run_quick_ci.py for the parsing + thresholds.
      - name: Run quick benchmarks
        working-directory: smash
        run: python3 bench/run_quick_ci.py --build-dir build

  # ── Packages + oldest supported glibc ────────────────────────────────────
  # Builds libsmash and its .deb/.rpm/.tar.gz exactly as release.yml does
  # (manylinux_2_28, packaging/linux/build-manylinux.sh), then installs the
  # .deb on glibc 2.31 (Ubuntu 20.04, Debian 11) and the .rpm on glibc 2.28
  # (AlmaLinux 8) and preloads a probe in both modes. glibc < 2.34's dlsym
  # callocs its dlerror state, re-entering a half-initialised smash; that once
  # hung (full mode) or stack-overflowed (large-only) every preloaded process,
  # and ubuntu-latest's glibc is too new for the main job to notice.
  packages-old-glibc:
    name: packages (glibc 2.28/2.31)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smash
        uses: actions/checkout@v4
        with:
          path: smash

      - name: Checkout alloc8 (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: emeryberger/alloc8
          path: alloc8

      - name: Build libsmash + packages in manylinux_2_28
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash smash/packaging/linux/build-manylinux.sh /work/smash /work/alloc8

      - name: Install and preload on Ubuntu 20.04, Debian 11, AlmaLinux 8
        working-directory: smash
        run: |
          mkdir -p probe
          printf '#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){char*p=malloc(4<<20);if(!p)return 1;memset(p,1,4<<20);free(p);puts("probe ok");return 0;}\n' > probe/probe.c
          docker run --rm -v "$PWD/probe:/p" quay.io/pypa/manylinux_2_28_x86_64 \
            gcc -O2 -o /p/probe /p/probe.c
          for img in ubuntu:20.04 debian:11 quay.io/pypa/manylinux_2_28_x86_64; do
            docker run --rm -v "$PWD/build/pkg:/pkg:ro" -v "$PWD/probe:/p:ro" "$img" \
              bash -euo pipefail -c '
                . /etc/os-release; echo "== $PRETTY_NAME"
                if command -v dpkg >/dev/null; then dpkg -i /pkg/smash_*_amd64.deb >/dev/null
                else rpm -i /pkg/smash-*.x86_64.rpm; fi
                for mode in 0 1; do
                  out=$(SMASH_STATS=1 SMASH_LARGE_ONLY=$mode timeout 60 /usr/bin/smash /p/probe 2>&1)
                  echo "SMASH_LARGE_ONLY=$mode: $out"
                  grep -q "probe ok" <<<"$out"
                  grep -q "\[smash stats\]" <<<"$out"
                done
              '
          done
